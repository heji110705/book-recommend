# -*- coding: utf-8 -*-
# 可选：Nginx 反向代理参考配置（单容器方案已内置 whitenoise，无需 Nginx 也可运行）
# 用法：将静态/媒体目录通过卷挂载到 Nginx，再反代到 gunicorn(8000)。

# 1) 先在应用容器生成静态文件并放到 Nginx 可读目录：
#    docker cp book-recommend:/app/static_collected ./static_collected
# 2) 用本配置启动 Nginx。
server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 10m;

    # 静态资源（whitenoise 已处理，Nginx 可再缓存加速）
    location /static/ {
        alias /data/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 封面 / 上传媒体
    location /media/ {
        alias /data/media/;
        expires 30d;
    }

    # 反向代理到 Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
