<div class="col-6 col-md-4 col-lg-3 mb-3">
  <div class="book-card">
    <a href="{% url 'book_detail' book.id %}">
      <div class="book-cover cover-{{ book.category }}">{{ book.title|first }}</div>
    </a>
    <div class="card-body">
      <a href="{% url 'book_detail' book.id %}"><div class="book-title">{{ book.title }}</div></a>
      <div class="book-meta mt-1">{{ book.author }} · {{ book.category }}</div>
      <div class="d-flex justify-content-between align-items-center mt-2">
        {% if book.rating_count > 0 %}
        <span class="score-pill">{{ book.rating_avg }}</span>
        {% else %}
        <span class="badge bg-secondary">暂无评分</span>
        {% endif %}
        <small class="text-muted">{{ book.rating_count }} 人评</small>
      </div>
      <div class="mt-2">
        {% for tag in book.tag_list|slice:':3' %}
        <span class="tag-badge">{{ tag }}</span>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
